<svg width="680" height="566" viewBox="0 0 680 566" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Auto-healing CI flow</title>
  <desc>Playwright test run leads to a CI failure signal, then a LangGraph orchestration agent diagnoses the issue, an auto-heal script patches the page object, the test re-runs, and the result either produces an Allure report or flags the failure for human review.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; font-weight: 400; }
    .arr { stroke: #73726c; stroke-width: 0.5; }
  </style>

  <!-- Playwright test run -->
  <rect x="270" y="40" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central" fill="#444441">Playwright test run</text>
  <line x1="340" y1="84" x2="340" y2="120" class="arr" marker-end="url(#arrow)"/>

  <!-- CI failure signal -->
  <rect x="250" y="120" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="340" y="142" text-anchor="middle" dominant-baseline="central" fill="#444441">CI failure signal</text>
  <line x1="340" y1="164" x2="340" y2="200" class="arr" marker-end="url(#arrow)"/>

  <!-- Orchestration agent -->
  <rect x="230" y="200" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="340" y="220" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Orchestration agent</text>
  <text class="ts" x="340" y="240" text-anchor="middle" dominant-baseline="central" fill="#534AB7">LangGraph-based diagnosis</text>
  <line x1="340" y1="256" x2="340" y2="296" class="arr" marker-end="url(#arrow)"/>

  <!-- Auto-heal script -->
  <rect x="230" y="296" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="340" y="316" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Auto-heal script</text>
  <text class="ts" x="340" y="336" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Patches page object</text>
  <line x1="340" y1="352" x2="340" y2="392" class="arr" marker-end="url(#arrow)"/>

  <!-- Re-run test -->
  <rect x="270" y="392" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="340" y="414" text-anchor="middle" dominant-baseline="central" fill="#444441">Re-run test</text>

  <!-- Branches -->
  <path d="M340,436 L340,453 L175,453 L175,470" fill="none" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="250" y="448" text-anchor="middle" fill="#5F5E5A">pass</text>
  <path d="M340,436 L340,453 L505,453 L505,470" fill="none" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="430" y="448" text-anchor="middle" fill="#5F5E5A">still failing</text>

  <!-- Allure report -->
  <rect x="60" y="470" width="230" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="175" y="490" text-anchor="middle" dominant-baseline="central" fill="#085041">Allure report</text>
  <text class="ts" x="175" y="510" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Pass — dashboard updated</text>

  <!-- Flag for review -->
  <rect x="390" y="470" width="230" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="th" x="505" y="490" text-anchor="middle" dominant-baseline="central" fill="#712B13">Flag for review</text>
  <text class="ts" x="505" y="510" text-anchor="middle" dominant-baseline="central" fill="#993C1D">Still failing</text>
</svg>
